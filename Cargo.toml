[package]
name = "omen-rs"
version = "0.1.0"
edition = "2021"
default-run = "omen"

[[bin]]
name = "omen"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
num_enum = "0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zerocopy = "0.8.57"
[dev-dependencies]
proptest = "1.11.0"
